appId: com.funtime.mobile
---
- runFlow: boot-to-login.yaml
- tapOn: "Don't have an account? Sign up"
- extendedWaitUntil:
    visible: "Create an account"
    timeout: 30000
- tapOn:
    id: "signup-email-input"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "signup-password-input"
- inputText: "Password123!"
- tapOn:
    id: "signup-password-confirm-input"
- inputText: "Password123!"
- hideKeyboard
- tapOn:
    id: "signup-create-account"
# Local Supabase has email confirmations off, so signup creates a session and
# routes to confirm-signup. Dismiss whichever dialog is covering that screen.
- tapOn:
    text: "Go to Login"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: "First Name"
    timeout: 60000
- tapOn:
    id: "confirm-signup-first-name"
- inputText: "Maestro"
- tapOn:
    id: "confirm-signup-last-name"
- inputText: "Tester"
- tapOn:
    id: "confirm-signup-username"
- inputText: ${E2E_USERNAME}
- hideKeyboard
- tapOn:
    id: "confirm-signup-finish"
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "My Leagues"
    timeout: 30000
- tapOn: "Pick"
- tapOn:
    id: "pick-create-league"
- extendedWaitUntil:
    visible: "League Name"
    timeout: 30000
- tapOn:
    id: "create-league-name"
- inputText: "E2E League One"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "create-league-superbowl-disabled"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "create-league-superbowl-disabled"
- tapOn:
    id: "create-league-submit"
- tapOn: "Pick"
- extendedWaitUntil:
    visible: "Randomize Open Picks"
    timeout: 60000
- tapOn:
    id: "picks-randomize"
- runFlow:
    when:
      visible:
        id: "picks-tiebreaker-score"
    commands:
      - tapOn:
          id: "picks-tiebreaker-score"
      - inputText: "47"
      - hideKeyboard
- tapOn:
    id: "picks-submit"
- assertVisible: "Update Picks"
