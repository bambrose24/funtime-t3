appId: com.funtime.mobile
---
# Requires MAESTRO_JOIN_CODE to be provided by the caller.
- runFlow: boot-to-login.yaml
- tapOn: "Don't have an account? Sign up"
- tapOn:
    id: "signup-email-input"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "signup-password-input"
- inputText: "Password123!"
- tapOn:
    id: "signup-password-confirm-input"
- inputText: "Password123!"
- hideKeyboard
- tapOn:
    id: "signup-create-account"
- tapOn:
    text: "Go to Login"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: "First Name"
    timeout: 60000
- tapOn:
    id: "confirm-signup-first-name"
- inputText: "Maestro"
- tapOn:
    id: "confirm-signup-last-name"
- inputText: "Joiner"
- tapOn:
    id: "confirm-signup-username"
- inputText: ${E2E_USERNAME}
- hideKeyboard
- tapOn:
    id: "confirm-signup-finish"
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Join League"
    timeout: 30000
- tapOn:
    id: "home-join-league"
- tapOn:
    id: "join-league-code"
- inputText: "${MAESTRO_JOIN_CODE}"
- hideKeyboard
- tapOn:
    id: "join-league-continue"
- tapOn:
    id: "join-league-register"
- tapOn: "Pick"
- tapOn:
    id: "picks-randomize"
- runFlow:
    when:
      visible:
        id: "picks-tiebreaker-score"
    commands:
      - tapOn:
          id: "picks-tiebreaker-score"
      - inputText: "47"
      - hideKeyboard
- tapOn:
    id: "picks-submit"
- assertVisible: "Update Picks"
