appId: com.funtime.mobile
---
- runFlow:
    file: boot-and-login.yaml
    env:
      LOGIN_EMAIL: ${E2E_ADMIN_EMAIL}
- openLink: ${E2E_EXPO_ROUTE_URL}/league/${E2E_ADMIN_OPS_LEAGUE_ID}/admin
- extendedWaitUntil:
    visible: "League Broadcast"
    timeout: 30000
- assertVisible: "Members"
- scrollUntilVisible:
    element:
      text: "weboutsider"
    direction: DOWN
- swipe:
    start: 90%, 75%
    end: 10%, 75%
    duration: 500
- assertVisible: "Emails"
- assertVisible: "Edit"
