- runFlow:
    file: boot-and-login.yaml
    env:
      LOGIN_EMAIL: ${E2E_ADMIN_EMAIL}
- openLink: ${E2E_EXPO_ROUTE_URL}/league/${E2E_ADMIN_OPS_LEAGUE_ID}/admin
- extendedWaitUntil:
    visible: "League Admin"
    timeout: 30000
- assertVisible: "League Broadcast"
- assertVisible: "Members"
- scrollUntilVisible:
    element:
      text: "weboutsider"
    direction: DOWN
- assertVisible: "Emails"
- assertVisible: "Edit"
