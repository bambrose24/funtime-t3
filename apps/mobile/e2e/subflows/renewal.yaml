appId: com.funtime.mobile
---
- runFlow:
    file: boot-and-login.yaml
    env:
      LOGIN_EMAIL: ${E2E_ADMIN_EMAIL}
- openLink: ${E2E_EXPO_ROUTE_URL}/league/${E2E_MOBILE_RENEWAL_LEAGUE_ID}/admin
- extendedWaitUntil:
    visible: "Set Up Next Season"
    timeout: 30000
- tapOn: "Set Up Next Season"
- extendedWaitUntil:
    visible: "Set Up the 2027 Season"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Review Invites"
    direction: DOWN
- tapOn: "Review Invites"
- extendedWaitUntil:
    visible: "Review next-season invites"
    timeout: 30000
- assertVisible: "Last season"
- assertVisible: "Admin"
- assertVisible: "Players marked Admin will be admins in the new league when they join."
- assertVisible:
    text: "Missed .* picks|Picked every game"
- tapOn: "Invite webplayer"
- assertVisible: "Create League & Send 1 Invite"
- tapOn: "Invite webplayer"
- tapOn: "Create League & Send 2 Invites"
- extendedWaitUntil:
    visible: "Invite last year's players"
    timeout: 60000
