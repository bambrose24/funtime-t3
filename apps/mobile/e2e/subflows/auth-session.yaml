appId: com.funtime.mobile
---
- runFlow:
    file: boot-and-login.yaml
    env:
      LOGIN_EMAIL: ${E2E_OUTSIDER_EMAIL}
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
- assertVisible: "Sign Out"
- tapOn: "Sign Out"
- assertVisible: "Sign out?"
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 30000
