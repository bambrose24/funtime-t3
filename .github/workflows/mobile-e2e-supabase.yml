name: Mobile E2E (Supabase Local)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/api/**"
      - "scripts/e2e/**"
      - ".github/workflows/mobile-e2e-supabase.yml"
  merge_group:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/api/**"
      - "scripts/e2e/**"
      - ".github/workflows/mobile-e2e-supabase.yml"

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_DB_URL: "postgresql://postgres:postgres@127.0.0.1:55422/postgres"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      EXPO_NO_TELEMETRY: "1"
      ELECTRON_DISABLE_SANDBOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -e /dev/kvm ]]; then
            echo "KVM is available"
            ls -l /dev/kvm
          else
            echo "KVM is not available; the emulator will use software rendering"
          fi

      - name: Build deterministic seed
        run: pnpm e2e:fixtures:build-seed

      - name: Start backend + seed + verify
        run: pnpm e2e:backend:up

      - name: Run Android emulator + Maestro flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6144M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            eval "$(supabase status -o env | sed 's/^/export /')"

            export E2E_MAESTRO_FLOW="apps/mobile/e2e/flows/smoke-signup-create-pick.yaml"
            export E2E_INSTALL_DEV_CLIENT=1
            export E2E_FORCE_REINSTALL_DEV_CLIENT=0
            export E2E_CLEAR_DEV_CLIENT_DATA=1
            export E2E_EMULATOR_WAIT_SECONDS=300
            export E2E_ANDROID_ARCH=x86_64
            pnpm e2e:mobile:maestro -- --skip-backend-up

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-logs
          path: |
            /tmp/funtime-web.log
            /tmp/funtime-expo.log
            /tmp/funtime-e2e-web.log
            /tmp/funtime-e2e-expo.log
            /tmp/funtime-e2e-open-link.log
            /tmp/funtime-e2e-dev-client-build.log
            /tmp/funtime-e2e-dev-client-prebuild.log
            /tmp/funtime-e2e-dev-client-adb-install.log
            /tmp/funtime-e2e-logcat.txt
            /home/runner/.maestro/tests
            apps/mobile/e2e/flows
          if-no-files-found: warn
